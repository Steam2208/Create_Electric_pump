plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.78'
}

version = '1.0.2'
group = 'com.electricpump'

base {
    archivesName = 'create_electric_pump'
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = '21.1.247'

    runs {
        client {
            client()
        }
        server {
            server()
        }
    }

    mods {
        create_electric_pump {
            sourceSet(sourceSets.main)
        }
    }
}

repositories {
    mavenCentral()
    maven {
        name = 'Create Maven'
        url = 'https://maven.createmod.net/'
    }
    maven {
        name = 'Registrate Maven'
        url = 'https://maven.ithundxr.dev/snapshots'
    }
}

dependencies {
    implementation 'com.simibubi.create:create-1.21.1:6.0.10-281'
    compileOnly 'net.createmod.ponder:ponder-neoforge:1.0.82+mc1.21.1'
    compileOnly 'dev.engine-room.flywheel:flywheel-neoforge-1.21.1:1.0.6'
    compileOnly 'com.tterrag.registrate:Registrate:MC1.21-1.3.0+67'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
